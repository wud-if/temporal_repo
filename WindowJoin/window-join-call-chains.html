<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>WindowJoin 核心调用链 — Flink 原生 vs Flink-Gluten-Velox</title>
<style>
  :root {
    --fn: #1a56b0; --phase: #6b21a8; --data: #0f766e; --fix: #dc2626;
    --warn: #d97706; --jni: #be185d; --border: #d4d4d8; --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f4f4f5; color: #27272a; }
  header { background: #18181b; color: #fff; padding: 14px 24px; position: sticky; top: 0; z-index: 10;
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .btn { background: #3f3f46; color: #fff; border: 1px solid #52525b; border-radius: 6px;
         padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: #52525b; }
  .legend { display: flex; gap: 14px; font-size: 12px; margin-left: auto; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 80px; }
  .chain { background: #fff; border: 1px solid var(--border); border-radius: 10px;
           margin-bottom: 28px; overflow: hidden; }
  .chain > h2 { margin: 0; padding: 14px 20px; font-size: 16px; cursor: pointer;
                user-select: none; border-bottom: 1px solid var(--border); }
  .chain > h2 .arrow { margin-right: 8px; display: inline-block; transition: .15s; }
  .chain.collapsed > h2 .arrow { transform: rotate(-90deg); }
  .chain.collapsed .body { display: none; }
  .body { padding: 14px 20px 20px; }
  .node { margin-left: 0; }
  .children { margin-left: 22px; border-left: 2px solid var(--border);
              padding-left: 14px; margin-top: 4px; }
  .node.collapsed > .children { display: none; }
  .row { display: flex; align-items: baseline; gap: 8px; padding: 3px 4px; border-radius: 5px;
         cursor: pointer; flex-wrap: wrap; }
  .row:hover { background: #f0f4ff; }
  .toggle { width: 14px; color: #71717a; font-size: 11px; flex: none; }
  .row.leaf .toggle { visibility: hidden; }
  .name { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13.5px; font-weight: 600; }
  .loc { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: #71717a;
         background: #f4f4f5; border-radius: 4px; padding: 1px 6px; }
  .badge { font-size: 11px; border-radius: 4px; padding: 1px 7px; font-weight: 600; }
  .fix   { color: #fff; background: var(--fix); }
  .warn  { color: #fff; background: var(--warn); }
  .jni   { color: #fff; background: var(--jni); }
  .desc { flex-basis: 100%; margin: 1px 0 4px 22px; font-size: 12.5px; color: #52525b; }
  .t-fn    .name { color: var(--fn); }
  .t-phase .name { color: var(--phase); }
  .t-data  .name { color: var(--data); font-weight: 500; }
  .t-jni   .name { color: var(--jni); }
  .note { margin: 10px 0; padding: 8px 14px; border-radius: 6px; font-size: 12.5px;
          background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: #f4f4f5; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #f4f4f5;
         padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>WindowJoin 核心调用链</h1>
  <button class="btn" onclick="setAll(false)">全部收起</button>
  <button class="btn" onclick="setAll(true)">全部展开</button>
  <div class="legend">
    <span><i class="dot" style="background:#6b21a8"></i>阶段/入口</span>
    <span><i class="dot" style="background:#1a56b0"></i>函数</span>
    <span><i class="dot" style="background:#0f766e"></i>数据/动作</span>
    <span><i class="dot" style="background:#be185d"></i>JNI 分界</span>
    <span><i class="dot" style="background:#dc2626"></i>待修</span>
    <span><i class="dot" style="background:#d97706"></i>待核实</span>
  </div>
</header>
<main id="root"></main>

<script>
const DATA = [

  { name: "A1. 编译期：SQL → Transformation", type: "phase", children: [

        { name: "WindowJoinOperatorBuilder.build()", type: "fn", desc: "按 joinType 分派构建 6 种算子子类（Inner/Left/Right/Full/SemiAnti）。" },

  { name: "A2. 运行期：数据面", type: "phase", children: [
    { name: "上游供给：窗口聚合结算", type: "phase", desc: "水位线到达 windowEnd 时聚合结算，产出携带 window_start/end 的行——join 的输入。", children: [

        { name: "SliceSharedProcessor（hop/cumulate）", type: "fn", desc: "mergeSlices 合并覆盖的所有切片累积器后输出（状态 O(slice)）。" },
        { name: "UnsliceProcessor（session）", type: "fn", desc: "经 MergingWindowProcessFunction 输出动态合并后的会话窗口。" } ] },
      { name: "collect + 转发水位线", type: "data", desc: "先发结算数据再转发水位线——算子契约保证 join 侧数据先于水位线到达。" } ] },
    { name: "WindowJoinOperator：入桶", type: "phase", children: [
      { name: "processElement1 / processElement2", loc: "WindowJoinOperator.java:203/208", type: "fn", desc: "左右流输入入口，转发到统一处理。" },
      { name: "processElement", loc: ":212", type: "fn", desc: "单行处理主流程。", children: [

    { name: "水位线推进 → 定时器 → 配对 → 清桶", type: "phase", children: [
      { name: "onEventTime(timer)", loc: ":244", type: "fn", desc: "定时器回调：join+清状态原子完成。", children: [
        { name: "left/rightWindowState.get(window)", loc: ":248-249", type: "data", desc: "取该 (key, windowEnd) 桶内两侧全量行列表。" },
        { name: "join(leftData, rightData)", loc: ":250", type: "fn", desc: "虚函数，按 joinType 分派子类。", children: [

{ title: "B. Flink-Gluten-Velox 调用链", note: "pull 批级驱动；状态粒度为 RowVectorPtr（向量级）；join 引擎复用 velox NestedLoopJoinProbe。红色【待修】= 开发方案差距项。", children: [

      { name: "TableScanNode(ExternalStreamTableHandle) ×2", loc: ":192-203", type: "fn", desc: "左右输入声明为外部流扫描——运行时对接 Java 侧阻塞队列。" },

      { name: "StreamWindowJoinNode", loc: ":219-230", type: "fn", desc: "窗口 join 计划节点：双输入 + 分区函数 + probe + 窗口列下标。" },

    { name: "Java 侧：GlutenTwoInputOperator", loc: "gluten-flink/runtime/.../GlutenTwoInputOperator.java", type: "phase", children: [

        { name: "newBlockingQueue ×2", loc: ":403-404", type: "data", desc: "左/右外部流阻塞队列（native TableScan 的数据源）。" },
        { name: "session.queryOps().execute(query)", loc: ":411", type: "fn", desc: "提交有状态查询，触发 StatefulTask::create。" } ] },

      { name: "processWatermark1/2(mark)", loc: ":241/:252", type: "fn", desc: "分侧水位线通知 native（带输入序号 0/1），再驱动推进。" },
      { name: "drainTaskOutput()", loc: ":196", type: "fn", desc: "推进循环：反复驱动 native 直到无输出。", children: [
        { name: "task.advance()", type: "fn", desc: "JNI 驱动原生推进一步（Available/Blocked/Done）。" },
        { name: "task.statefulGet()", type: "fn", desc: "取回一个输出元素（水位线/状态/记录）。", children: [

      { name: "advance()", loc: ":78", type: "fn", desc: "每次推进先处理左侧再处理右侧（拉取式双流）。", children: [
        { name: "processData(left)", loc: ":86", type: "fn", desc: "左侧一个批次处理全流程（右侧同构）。", children: [
          { name: "input->getOutput()", loc: ":91", type: "data", desc: "从左外部流拉出一个 RowVector（批，非行）。" },
          { name: "filterWindowFiredRows", loc: ":93", type: "fn", badges: [{cls:"fix", text:"待修2"}], desc: "迟到过滤——当前空实现，直接返回原向量。" },
          { name: "keySelector->partition", loc: ":94", type: "fn", desc: "按 join 键把向量拆分为 key→子向量（1024 分区）。" },

          { name: "probe_->addInput + setBuildData", type: "fn", desc: "左侧向量作 probe 逐个喂入，右侧全部向量作 build 侧。" },
          { name: "probe_->getOutput()", type: "fn", desc: "NestedLoopJoinProbe 按条件（当前仅等值）做配对并输出结果向量。" },

    ] } ] },

{ title: "C. 两链对照", table: [
  ["维度", "Flink 原生", "GFV", "影响"],
  ["驱动模型", "push（每行 processElement）", "pull（Java 入队→native 拉批 RowVector）", "GFV 状态粒度是向量级；外连接记录级标记需重新设计（阶段 3 难点）"],
  ["剩余条件", "codegen GeneratedJoinCondition", "NestedLoopJoinNode 条件（当前仅等值拼接）", "待修4：非等值并入 probe 条件即得 q5"],
  ["join 类型", "6 子类显式实现", "probe 携 joinType + 桶级短路", "待修3：短路破坏外连接"],
  ["分区对齐", "Flink keyBy（剩余键 hash）", "Flink keyBy 保留 + native KeySelector 1024 分区", "双层分区，R2 待核"],
  ["水位线", "InternalTimerService 直推", "桥 notifyWatermark(idx)→链式→timerService", "R1：双流取 min 与数据先于水位线序待证"],
  ["状态", "keyed State + ns=windowEnd，行级", "stateHandler ListState，向量级", "同构 (key,ns)；粒度差异是外连接主要适配点"],
] }
];

function renderNode(n) {
  const hasKids = n.children && n.children.length;
  const leaf = !hasKids;
  const badges = (n.badges||[]).map(b=>`<span class="badge ${b.cls}">${b.text}</span>`).join(" ");
  const loc = n.loc ? `<span class="loc">${n.loc}</span>` : "";
  const desc = n.desc ? `<div class="desc">${n.desc}</div>` : "";
  const kids = hasKids ? `<div class="children">${n.children.map(renderNode).join("")}</div>` : "";
  return `<div class="node t-${n.type||"fn"}${hasKids?"":" leaf"}" ${hasKids?"data-open='1'":""}>
    <div class="row" ${hasKids?"onclick=\"toggle(event,this)\"":""}>
      <span class="toggle">${hasKids?"▼":""}</span>
      <span class="name">${n.name}</span>${loc}${badges}
    </div>${desc}${kids}</div>`;
}

function toggle(ev, row) {
  if (ev.target.classList.contains("name") || ev.target.classList.contains("loc") || ev.target.classList.contains("badge") || ev.target.parentElement === row) {
    const node = row.parentElement;
    const open = node.dataset.open === "1";
    node.dataset.open = open ? "0" : "1";
    node.classList.toggle("collapsed", open);
    row.querySelector(".toggle").textContent = open ? "▶" : "▼";
  }
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = DATA.map(chain => {
    if (chain.table) {
      const rows = chain.table.map((r,i)=> i===0
        ? `<tr>${r.map(c=>`<th>${c}</th>`).join("")}</tr>`
        : `<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("");
      return `<div class="chain"><h2 onclick="this.parentElement.classList.toggle('collapsed')"><span class="arrow">▼</span>${chain.title}</h2>
        <div class="body"><table>${rows}</table></div></div>`;
    }
    const body = (chain.note?`<div class="note">${chain.note}</div>`:"") + chain.children.map(renderNode).join("");
    return `<div class="chain"><h2 onclick="this.parentElement.classList.toggle('collapsed')"><span class="arrow">▼</span>${chain.title}</h2>
      <div class="body">${body}</div></div>`;
  }).join("");
}

function setAll(open) {
  document.querySelectorAll(".node").forEach(n => {
    if (n.querySelector(".children")) {
      n.dataset.open = open ? "1" : "0";
      n.classList.toggle("collapsed", !open);
      n.querySelector(".toggle").textContent = open ? "▼" : "▶";
    }
  });
}

render();
// 默认展开到第 2 层（收起更深）
setTimeout(() => {
  document.querySelectorAll(".children .children").forEach(c => {
    const n = c.closest(".node");
    if (n && !n.closest(".children .children .children")) {
      n.dataset.open = "0"; n.classList.add("collapsed");
      n.querySelector(".toggle").textContent = "▶";
    }
  });
}, 0);
</script>
</body>
</html>
